[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-baldr"
version = "0.1.0"
description = "Baldr MCP Gateway (mcp-baldr): a centralized reverse proxy for stdio MCP server subprocesses."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

dependencies = [
    "mcp>=2.3,<3",
    "pydantic>=2.10,<3",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.8,<1",
]

[project.scripts]
mcp-baldr = "mcp_baldr.gateway.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_baldr*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"
